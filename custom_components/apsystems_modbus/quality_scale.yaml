rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions; the power limit is a number entity set with number.set_value.
  appropriate-polling: done
  brands:
    status: exempt
    comment: The icon ships in the repository's brand folder; no external brands entry.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions; the README documents the power limit number.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data; the number writes through the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Every entity follows the coordinator, except the power limit numbers. Those stay available on purpose, because Home Assistant skips actions on unavailable entities and a release must always be tried.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The ECU has no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Inverters are fixed by the addresses set in EMA Manager; change them via reconfigure.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: An installation power that does not match the inverters raises a repair issue, and so does an inverter that got another address in EMA Manager. A replaced inverter on a known address simply continues under its device.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Modbus TCP, no HTTP session.
  strict-typing: done
